# Deferred wiring for later milestones — not required for M1–M2.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dualmind
      POSTGRES_PASSWORD: dualmind
      POSTGRES_DB: dualmind
    ports:
      - "5432:5432"
    volumes:
      - dualmind_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dualmind
      MINIO_ROOT_PASSWORD: dualmindsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dualmind_minio:/data

volumes:
  dualmind_pg:
  dualmind_minio:
